<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alessio Keilty</title>
  <link rel="stylesheet" href="/3/style.css">
</head>
<body>
  <div id="app">
    <div id="top-bar">
      <span id="gallery-index-btn" role="button" tabindex="0">Index overview</span>
      <span id="expand-btn" role="button" tabindex="0">Expand</span>
    </div>
    <div id="viewport"><div id="track"></div></div>
    <div id="sidebar-area">
      <div id="sidebar-counter"><span id="cur">01</span><span id="tot">/00</span></div>
      <div id="sidebar"><div id="sidebar-inner"></div></div>
    </div>
    <div id="bottom-bar">
      <div id="about-content">
        <div class="contact-row"><span class="contact-label">M</span><a id="about-email" class="contact-link"></a></div>
        <div class="contact-row"><span class="contact-label">IG</span><a id="about-instagram" class="contact-link" target="_blank" rel="noopener noreferrer"></a></div>
        <div id="about-bio"></div>
      </div>
      <div id="bottom-row">
        <span id="about-link" role="button" tabindex="0">About</span>
        <div id="meta-group">
          <span id="meta-back">Back to</span>
          <span id="meta-client"></span>
          <span id="meta-title"></span>
          <span id="meta-desc"></span>
        </div>
      </div>
      <div id="author-name">Alessio Keilty</div>
    </div>
    <div id="grid-overlay" hidden>
      <div id="index-header">
        <span id="index-title-btn">Index overview</span>
        <span id="grid-close" role="button" tabindex="0">Go to the viewer</span>
      </div>
      <div id="index-cols"></div>
    </div>
    <div id="index-onview">
      <span id="index-onview-label">On view</span>
      <span id="index-onview-client"></span>
      <span id="index-onview-title"></span>
      <span id="index-onview-desc"></span>
    </div>
    <div id="index-about">About</div>
    <div id="index-author">Alessio Keilty</div>
    <div id="index-nav">
      <span id="index-prev" role="button" tabindex="0">Prev</span>
      <span id="index-next" role="button" tabindex="0">Next</span>
    </div>
    <div id="empty-state" hidden>
      <p>Nessun contenuto.<br><a href="/admin">Vai all'admin</a> per aggiungere progetti.</p>
    </div>
  </div>
  <script src="/3/main.js"></script>
</body>
</html>
